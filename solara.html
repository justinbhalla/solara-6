<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Solara — Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card{box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
    .lift{transition:transform .12s ease, box-shadow .12s ease}
    .lift:hover{transform:translateY(-2px)}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Helvetica Neue", monospace}
    #debugPanel { position: fixed; bottom: 80px; right: 16px; z-index: 60; width: 320px; max-height: 50vh; overflow:auto; border-radius: 12px; }
  </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans">

  <header class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900">
    <div class="flex items-center gap-4">
      <a href="workspace.html" class="rounded-lg px-3 py-2 bg-indigo-50 text-indigo-600">← Workspaces</a>
      <div>
        <h1 class="text-xl font-semibold">Workspace</h1>
        <p id="wsNameSmall" class="text-sm text-gray-500 dark:text-gray-400">Loading…</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div id="presence" class="text-sm text-gray-600 dark:text-gray-300"></div>
      <button id="btnSignOut" class="px-3 py-1 rounded border">Sign out</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6">
    <div id="alert" class="hidden mb-4 p-3 rounded-xl text-sm"></div>

    <section class="mb-6">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold" id="wsTitle">Workspace</h2>
        <div class="flex items-center gap-2">
          <button id="btnInvite" class="px-3 py-1 rounded bg-indigo-600 text-white">Invite</button>
          <button id="btnNewTab" class="px-3 py-1 rounded border">New Tab</button>
        </div>
      </div>
      <p class="text-sm text-gray-500 mt-2" id="wsDescription">Manage tasks and collaborate.</p>
    </section>

    <section id="board" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- columns will be injected here -->
      <div id="skeletonCols" class="col-span-3 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="rounded-2xl p-4 bg-white dark:bg-gray-950 card skeleton" style="height:220px"></div>
        <div class="rounded-2xl p-4 bg-white dark:bg-gray-950 card skeleton" style="height:220px"></div>
        <div class="rounded-2xl p-4 bg-white dark:bg-gray-950 card skeleton" style="height:220px"></div>
      </div>
    </section>
  </main>

  <!-- debug panel (hidden by default unless ?debug=1) -->
  <div id="debugPanel" class="hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-3 shadow-xl">
    <div class="flex items-center justify-between mb-2">
      <strong class="text-sm">Debug — worker headers</strong>
      <button id="closeDebug" class="text-xs px-2 py-1 rounded border">Close</button>
    </div>
    <pre id="debugOutput" class="mono text-xs whitespace-pre-wrap text-gray-700 dark:text-gray-200"></pre>
    <div class="mt-2 text-right">
      <button id="btnRefreshDebug" class="px-2 py-1 text-xs rounded border">Refresh</button>
    </div>
  </div>

  <footer class="text-center text-xs text-gray-500 dark:text-gray-400 p-4 border-t border-gray-100 dark:border-gray-700">© 2025 ZenLock Group</footer>

  <script>
    const API_BASE = 'https://withered-disk-2405.justinbhalla28.workers.dev';
    const base = () => API_BASE.replace(/\/+$/, '');
    const $ = (s, r=document) => r.querySelector(s);
    const $$ = (s, r=document) => Array.from((r||document).querySelectorAll(s));

    // auth helpers (same semantics as workspace.html)
    const getCookie = (n)=>{ const m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]+)')); return m?decodeURIComponent(m[1]):null; };
    const getJWT = ()=> (localStorage.getItem('stytch_session_jwt') || getCookie('stytch_session_jwt') || getCookie('solara_session_jwt'));
    function setAlert(kind, msg){ const el=$('#alert'); el.className=`mb-4 p-3 rounded-xl text-sm ${kind==='error'?'bg-red-50 text-red-800 border border-red-200':'bg-emerald-50 text-emerald-800 border border-emerald-200'}`; el.textContent=msg; el.classList.remove('hidden'); setTimeout(()=>el.classList.add('hidden'),3500); }

    // API wrapper
    async function api(path, opts = {}) {
      const token = getJWT();
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const res = await fetch(`${base()}${path}`, {
        ...opts,
        mode: 'cors',
        credentials: 'include',
        headers
      });

      if (res.status === 401) return res;
      if (res.status === 500) {
        try { const b = await res.clone().json(); if ((b?.error||'').toLowerCase().includes('unauthorized')) return res; } catch {}
      }
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`API ${res.status}: ${text}`);
      }
      return res;
    }

    // Pull ws id from query string
    const params = new URLSearchParams(location.search);
    const wsId = params.get('ws') || localStorage.getItem('solara_last_ws') || '';

    // Simple UI helpers for board rendering
    function makeColumnHtml(id, title, cards) {
      const items = (cards||[]).map(c => `
        <div class="p-3 mb-2 rounded-xl border border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-950">
          <div class="flex items-start justify-between gap-3">
            <div><strong class="text-sm">${escapeHtml(c.title||'Untitled')}</strong><div class="text-xs text-gray-500 mt-1">${escapeHtml(c.description||'')}</div></div>
            <div class="text-xs text-gray-400">${c.assignee?escapeHtml(c.assignee):''}</div>
          </div>
        </div>`).join('');
      return `
        <div class="rounded-2xl p-4 bg-white dark:bg-gray-950 card" data-col="${escapeHtml(id)}">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold">${escapeHtml(title)}</h3>
            <span class="text-xs text-gray-500">${cards.length || 0}</span>
          </div>
          <div>${items}</div>
        </div>`;
    }
    function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    // Boot: check auth server-side first
    async function boot() {
      if (!wsId) { setAlert('error','Missing workspace id'); return; }
      try {
        const res = await fetch(base() + '/auth/check', { method:'GET', credentials:'include', mode:'cors', headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${getJWT() || ''}` }});
        if (!res || res.status !== 200) { location.href='sign-in.html'; return; }
        const user = await res.json();
        $('#btnSignOut').addEventListener('click', signOut);
        await loadWorkspace();
        startPresenceHeartbeat();
      } catch (err) {
        console.warn('auth.check failed, trying client token', err);
        const ok = await clientVerify();
        if (!ok) { location.href='sign-in.html'; return; }
        $('#btnSignOut').addEventListener('click', signOut);
        await loadWorkspace();
        startPresenceHeartbeat();
      }
    }

    async function clientVerify() {
      const jwt = getJWT(); if(!jwt) return false;
      try {
        const r = await fetch(base() + '/auth/check', { method:'GET', credentials:'include', mode:'cors', headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${jwt}` }});
        return r && r.status === 200;
      } catch { return false; }
    }

    async function signOut() {
      try { await fetch(base() + '/logout', { method: 'POST', credentials:'include', mode:'cors' }); } catch {}
      document.cookie='solara_session_jwt=; Max-Age=0; Path=/';
      document.cookie='stytch_session_jwt=; Max-Age=0; Path=/';
      localStorage.removeItem('stytch_session_jwt');
      location.href='sign-in.html';
    }

    // Load workspace metadata + tasks
    async function loadWorkspace(){
      // show skeleton until ready
      $('#skeletonCols').classList.remove('hidden');
      try {
        // GET tasks (tabs)
        const res = await api(`/tasks?workspace_id=${encodeURIComponent(wsId)}`);
        if (!res || res.status === 401) { location.href='sign-in.html'; return; }
        const body = await res.json();
        const tabs = body.tabs || {};
        // tabs structure expected: { "To Do": [ {title,description,...}, ... ], "In Progress": [...] , ... }
        const cols = Object.keys(tabs).length ? Object.keys(tabs) : ['To Do','In Progress','Done'];
        const html = cols.map(k => makeColumnHtml(k, k, tabs[k] || [])).join('');
        $('#board').innerHTML = html;
        $('#wsTitle').textContent = localStorage.getItem('solara_ws_name') || (`Workspace ${wsId}`);
        $('#wsNameSmall').textContent = `Workspace ID: ${wsId}`;
      } catch (err) {
        setAlert('error','Failed loading workspace: '+err.message);
        // fallback to cached state
        const cache = JSON.parse(localStorage.getItem('solara_ws_cache')||'{}');
        const tabs = cache?.[0] || {};
        $('#board').innerHTML = '<div class="col-span-3 text-sm text-gray-500">Could not load live workspace — showing cached state if any.</div>';
      } finally {
        $('#skeletonCols').classList.add('hidden');
      }
    }

    // presence heartbeat (HTTP fallback)
    let presenceTimer = null;
    function startPresenceHeartbeat(){
      sendPresenceBeat();
      presenceTimer = setInterval(sendPresenceBeat, 30 * 1000);
    }
    async function sendPresenceBeat(){
      try {
        await fetch(base() + '/presence/beat', {
          method:'POST',
          credentials:'include',
          mode:'cors',
          headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${getJWT() || ''}` },
          body: JSON.stringify({ workspace_id: wsId })
        });
      } catch (e) { /* ignore */ }
    }

    // Debug helpers (visible if ?debug=1)
    const debugOn = new URLSearchParams(location.search).get('debug') === '1';
    async function fetchDebugHeaders() {
      try {
        const resp = await fetch(base() + '/__debug/echo-headers', { method: 'GET', credentials: 'include', mode: 'cors' });
        if (!resp.ok) { $('#debugOutput').textContent = `HTTP ${resp.status}`; return; }
        const j = await resp.json();
        $('#debugOutput').textContent = JSON.stringify(j.headers, null, 2);
      } catch (e) {
        $('#debugOutput').textContent = String(e);
      }
    }

    // wire debug panel if requested
    if (debugOn) {
      $('#debugPanel').classList.remove('hidden');
      $('#closeDebug').onclick = ()=> $('#debugPanel').classList.add('hidden');
      $('#btnRefreshDebug').onclick = fetchDebugHeaders;
      // auto-fetch once
      fetchDebugHeaders();
    }

    // initial boot
    (async ()=> {
      if (!wsId) { setAlert('error','Workspace ID missing in URL'); return; }
      await boot();
    })();

  </script>
</body>
</html>
